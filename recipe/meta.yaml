{% set version = "2.7.0.5" %}

{% set cuda_major = cuda_compiler_version.split(".")[0]|int %}

{% set platform = "linux-x86_64" %}  # [linux64]
{% set platform = "linux-sbsa" %}  # [aarch64]
{% set platform = "windows-x86_64" %}  # [win]
{% set extension = "tar.xz" %}  # [not win]
{% set extension = "zip" %}  # [win]

{% set sha = "1540c437f4e18327731145e952daad24041be5bd7152bfef6c7c93cf8d69e7ed" %}  # [linux64 and (cuda_compiler_version or "").startswith("12")]
{% set sha = "056eb7234e6f79e7424bb14eb7333325ed6e294cc1128698c7030a6979835908" %}  # [aarch64 and (cuda_compiler_version or "").startswith("12")]
{% set sha = "4dad09693f978ae15927d395eb228e288fa59732597f7c42f8a44321bcf71cc7" %}  # [win64 and (cuda_compiler_version or "").startswith("12")]
{% set sha = "8f15c8094075bda122d41e0d1e7a53d73fc9555524862d171046178a24340cd4" %}  # [linux64 and (cuda_compiler_version or "").startswith("13")]
{% set sha = "d81acd749552214ebaef3606bdd41f7c373b8c3ff9524cc7050a728372777952" %}  # [aarch64 and (cuda_compiler_version or "").startswith("13")]
{% set sha = "84549d31acb88cdee1c3f307e662285fafa4e5ab0cbcf2d29bf8587d9f9a301f" %}  # [win64 and (cuda_compiler_version or "").startswith("13")]

package:
  name: cutensor
  version: {{ version }}

source:
  - url: https://developer.download.nvidia.com/compute/cutensor/redist/libcutensor/{{ platform }}/libcutensor-{{ platform }}-{{ version }}_cuda{{ cuda_major }}-archive.{{ extension }}
    sha256: {{ sha|default("") }}
  # Delegate git-clone from test scripts to the recipe
  - git_url: https://github.com/NVIDIA/CUDALibrarySamples.git
    # Update the commit hash on version bump
    git_rev: 241afd3c7a8d1d756100139a3f629df5475fcf5c
    folder: sample_linux

build:
  number: 0
  skip: true  # [osx or cuda_compiler_version in (undefined, "None")]
  run_exports:
    - {{ pin_subpackage('cutensor') }}
  ignore_run_exports_from:
    - {{ compiler('cuda') }}
  missing_dso_whitelist:
    - "*/libcuda.so.*"    # [linux]
    - "*/nvcuda.dll"      # [win]
  script_env:
    - cuda_major={{ cuda_major }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - arm-variant * {{ arm_variant_type }}  # [aarch64]
    - cf-nvidia-tools 1                     # [linux]
    - msys2-git                             # [win]
    - git                                   # [not win]
  host:
    - cuda-version {{ cuda_compiler_version }}
    - libcublas {{ libcublas }}
  run:
    - {{ pin_compatible("cuda-version", min_pin="x", max_pin="x") }}
    - libcublas {{ libcublas }}
  run_constrained:
    - arm-variant * {{ arm_variant_type }}  # [aarch64]

test:
  source_files:
    - sample_linux/
  requires:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
    # need the libcuda stub for import test
    - cuda-driver-dev  # [linux]
  files:
    - test_load_elf.c  # [linux]

about:
  home: https://developer.nvidia.com/cutensor
  license: LicenseRef-cuTENSOR-Software-License-Agreement
  license_url: https://docs.nvidia.com/cuda/cutensor/license.html
  license_file: LICENSE
  license_family: Other
  summary: Tensor Linear Algebra on NVIDIA GPUs
  description: |
    The cuTENSOR Library is a first-of-its-kind GPU-accelerated tensor linear
    algebra library providing tensor contraction, reduction and elementwise
    operations. cuTENSOR is used to accelerate applications in the areas of
    deep learning training and inference, computer vision, quantum chemistry
    and computational physics.
  doc_url: https://docs.nvidia.com/cuda/cutensor/index.html
  dev_url: https://developer.nvidia.com/cutensor/downloads

extra:
  skip-lints:
    - deprecate_license_url
  recipe-maintainers:
    - ChrisPsa
    - b-kloss
    - conda-forge/cuda
    - v0i0
    - yangcal
    - JeremyWangNVDA
    - leofang
    - jakirkham
    - mtjrider
