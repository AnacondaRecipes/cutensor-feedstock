arm_variant_type: # [aarch64]
  - sbsa          # [aarch64]

# Anaconda: build against the aggregate CBC CUDA versions (12.9 + 13.0) instead of
# the conda-forge pinning (12.9 + 13.4); the _cuda13 redist payload is identical.
# See ".ci_support" for more details.
cuda_compiler_version:
  - 12.9
  - 13.0

# Anaconda: pin libcublas per CUDA major because the aggregate CBC has no libcublas pin
libcublas:
  - 12
  - 13

zip_keys:
  -
    - cuda_compiler_version
    - libcublas
